name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Weekly, so a break from a toolchain update shows up on a Monday rather than
  # inside someone's pull request.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  # The committed lockfile's advisories against .github/advisories.txt: a new one fails, a listed one that is gone
  # fails until its line is taken off (coolms/.github, npm-advisories.yml).
  advisories:
    uses: coolms/.github/.github/workflows/npm-advisories.yml@develop

  build:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # engines.node names exactly these lines, each from the lockfile's floor (the
        # engines step below checks both), so the matrix is the claim.
        node: ['22', '24', '26']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      # engines.node names exactly the Node lines this matrix runs (no open
      # ">=22"), and within each the highest floor any package in the lockfile
      # declares.
      - name: Engines, against the matrix and the lockfile
        run: node tools/engines-check.mjs

      - name: Typecheck
        run: npm run typecheck

      # The suite is the whole argument for this package: the layout arithmetic
      # is asserted against measured expectations, so a regression shows up as a
      # failing number rather than as a document that looks slightly wrong.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # package.json publishes `dist`, so a build that produces no entry point
      # would ship an installable package that cannot be imported.
      - name: Assert the published entry points exist
        run: |
          for f in dist/index.js dist/index.d.ts; do
            if [ ! -s "$f" ]; then
              echo "::error::$f is missing or empty after build"
              exit 1
            fi
          done
          echo "confirmed: dist/index.js and dist/index.d.ts exist"

  # README, a LICENSE matching the manifest, and CHANGELOG (coolms/.github's basic-files.yml), pinned to a commit.
  basic-files:
    uses: coolms/.github/.github/workflows/basic-files.yml@595d36957a135e7d753abe34ca1ce90a0a6f2215
